<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat's Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050608;color:#e8edf2;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:auto}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:18px;letter-spacing:.12em;font-size:12px;color:#b8c0c8;text-shadow:0 2px 8px #000}.objective{position:absolute;top:18px;right:18px;text-align:right;font-size:13px;color:#dce4e9}.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#e7edf0;opacity:.8}.cross:before{width:14px;height:1px;top:6px}.cross:after{height:14px;width:1px;left:6px}.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid #ffffff18;background:#050608aa;border-radius:7px;font-size:12px;color:#c5cdd2}.start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#182026 0,#050608 58%,#020304 100%);pointer-events:auto}.card{max-width:520px;padding:34px;text-align:center;background:#0b0f12dd;border:1px solid #ffffff18;border-radius:14px;box-shadow:0 20px 80px #000}.card h1{margin:0 0 8px;font-size:42px;letter-spacing:.08em}.card p{color:#aeb8bf;line-height:1.6}.card button{margin-top:14px;padding:12px 24px;border:0;border-radius:8px;background:#dfe7eb;color:#081014;font-weight:700;cursor:pointer}.bar{position:absolute;bottom:22px;left:22px;width:150px;height:5px;background:#ffffff18;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#d7e0e4;transition:width .15s}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top">CHAT'S GAME // FIELD TEST 01</div><div class="objective" id="obj">OBJECTIVE: REACH THE LIGHT</div><div class="cross"></div><div class="bar"><i id="stamina"></i></div><div class="hint" id="hint">WASD to move • SHIFT to run • ESC to release mouse</div></div>
<div class="start" id="start"><div class="card"><h1>CHAT'S GAME</h1><p>A quiet road. A dead signal. Something is waiting beyond the trees.<br>Find the distant light and investigate the source.</p><button id="play">ENTER THE NIGHT</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),start=document.getElementById('start'),play=document.getElementById('play'),obj=document.getElementById('obj'),st=document.getElementById('stamina'),hint=document.getElementById('hint');let w,h,dpr,t=0,run=false,px=0,pz=0,yaw=0,pitch=0,keys={},mouse=false,energy=1,won=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'){mouse=false;document.exitPointerLock?.()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('click',()=>{if(!won)c.requestPointerLock?.()});document.addEventListener('pointerlockchange',()=>mouse=document.pointerLockElement===c);document.addEventListener('mousemove',e=>{if(mouse){yaw+=e.movementX*.0025;pitch=Math.max(-.4,Math.min(.4,pitch-e.movementY*.0015))}});
play.onclick=()=>{start.style.display='none';c.requestPointerLock?.();hint.textContent='Find the light. Listen for changes.'};
function project(wx,wz){let dx=wx-px,dz=wz-pz,co=Math.cos(yaw),si=Math.sin(yaw),cx=dx*co-dz*si,cz=dx*si+dz*co;if(cz<=.15)return null;let f=430/cz;return [w/2+cx*f,h*.53+(pitch*220)-f*.0,f]}
function draw(){t+=.016;x.fillStyle='#050709';x.fillRect(0,0,w,h);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#071019');sky.addColorStop(.48,'#172126');sky.addColorStop(1,'#050607');x.fillStyle=sky;x.fillRect(0,0,w,h);
let horizon=h*.53;let g=x.createLinearGradient(0,h*.48,0,h);g.addColorStop(0,'#273235');g.addColorStop(1,'#070909');x.fillStyle=g;x.fillRect(0,horizon,w,h-horizon);
for(let i=0;i<70;i++){let z=5+i*2.7, side=((i*97)%17)-8;for(let s=-1;s<=1;s+=2){let q=project(side+s*(5+(i%4)*1.5),z);if(q){let sz=Math.min(90,Math.max(2,q[2]*.18));x.fillStyle=i%3?'#111a1a':'#182322';x.beginPath();x.moveTo(q[0],q[1]-sz*2.3);x.lineTo(q[0]-sz,q[1]);x.lineTo(q[0]+sz,q[1]);x.fill();}}}
let road=x.createLinearGradient(0,horizon,0,h);road.addColorStop(0,'#15191a');road.addColorStop(1,'#252728');x.fillStyle=road;x.beginPath();x.moveTo(w*.49,horizon);x.lineTo(w*.51,horizon);x.lineTo(w*.94,h);x.lineTo(w*.06,h);x.closePath();x.fill();
for(let z=8;z<100;z+=7){let q=project(0,z);if(q){let ww=Math.min(w*.15,500/q[2]*z);x.strokeStyle='#313637';x.lineWidth=Math.max(1,80/q[2]);x.beginPath();x.moveTo(q[0]-ww,q[1]);x.lineTo(q[0]+ww,q[1]);x.stroke()}}
let light=project(0,68);if(light){let r=Math.max(5,120/light[2]);let rg=x.createRadialGradient(light[0],light[1]-r*1.8,2,light[0],light[1]-r*1.8,r*2.8);rg.addColorStop(0,'#fff7d9');rg.addColorStop(.12,'#e7d9a088');rg.addColorStop(1,'transparent');x.fillStyle=rg;x.fillRect(light[0]-r*3,light[1]-r*5,r*6,r*6);x.fillStyle='#eee3bc';x.fillRect(light[0]-r*.12,light[1]-r*2,r*.24,r*2);x.fillRect(light[0]-r*.8,light[1]-r*2.1,r*1.6,r*.18)}
let fog=x.createRadialGradient(w/2,h*.55,30,w/2,h*.55,Math.max(w,h)*.7);fog.addColorStop(0,'transparent');fog.addColorStop(1,'#020405cc');x.fillStyle=fog;x.fillRect(0,0,w,h);
if(Math.sin(t*1.7)>0.96){x.fillStyle='#ffffff08';x.fillRect(0,0,w,h)}if(won){x.fillStyle='#fff8dc22';x.fillRect(0,0,w,h);obj.textContent='OBJECTIVE COMPLETE: SIGNAL FOUND'}}
function update(){if(start.style.display!=='none'&&!won){draw();requestAnimationFrame(update);return}let f=(keys.w?1:0)-(keys.s?1:0),s=(keys.d?1:0)-(keys.a?1:0),mag=Math.hypot(f,s)||1;if(keys.shift&&energy>0&&f>0){run=true;energy=Math.max(0,energy-.012)}else{run=false;energy=Math.min(1,energy+.006)}let speed=run?.17:.095;px+=(Math.sin(yaw)*f+Math.cos(yaw)*s)/mag*speed;pz+=(Math.cos(yaw)*f-Math.sin(yaw)*s)/mag*speed;let dist=Math.hypot(px,pz-68);if(dist<4&&!won){won=true;obj.textContent='OBJECTIVE COMPLETE: SIGNAL FOUND';hint.textContent='You found it. Refresh to test again.';document.exitPointerLock?.()}st.style.width=(energy*100)+'%';draw();requestAnimationFrame(update)}update()})();
</script></body></html>
